<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício ES6 - Alunos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        h2 {
            color: #16a085;
            font-size: 1.2em;
            margin-top: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #ecf0f1;
            margin: 5px 0;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }
        .nota {
            font-weight: bold;
            color: #2980b9;
        }
        .aprovado {
            border-left: 5px solid #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exercício ES6</h1>
        
        <h2>Todos os Alunos:</h2>
        <ul id="lista-todos"></ul>
        
        <hr>
        
        <h2>Alunos Aprovados (Nota >= 6):</h2>
        <ul id="lista-aprovados"></ul>
    </div>

    <script src="main.js"></script>
</body>
</html>
